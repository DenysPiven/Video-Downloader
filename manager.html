<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Downloader</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }

    .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-weight: 600; font-size: 15px; }
    .big { font-size: clamp(56px, 12vw, 104px); font-weight: 700; line-height: .9; letter-spacing: -.04em; }
    .big small { font-size: .32em; letter-spacing: -.01em; color: var(--muted); font-weight: 500; margin-left: 6px; }
    .summary { color: var(--muted); margin-top: 10px; }

    .folder { display: flex; align-items: center; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .folder .path { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder .path.none { color: var(--muted); font-weight: 500; }
    .opts { display: flex; align-items: center; gap: 8px; color: var(--muted); padding: 12px 0; cursor: pointer; width: fit-content; }

    .banner { margin: 16px 0 0; padding: 14px 16px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 500; }
    .banner button { background: var(--on-accent); color: var(--accent); }
    .banner[hidden] { display: none; }

    ol { list-style: none; margin: 8px 0 0; padding: 0; }
    li { padding: 14px 0; border-bottom: 1px solid var(--line); animation: rise .35s ease both; }
    .job-top { display: flex; align-items: baseline; gap: 12px; }
    .job-name { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job-state { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .job-state.ok { color: var(--ok); } .job-state.err { color: var(--err); }
    .bar { height: 3px; margin-top: 10px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
    @media (prefers-color-scheme: light) { .bar > i { background: var(--fg); } }
    .job-note { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .job-note button { font-size: 12px; }
    .empty { padding: 40px 0; color: var(--muted); }

    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div>
        <div class="brand"><img class="mark" src="icons/logo.svg" width="28" height="28" alt="">Video Downloader</div>
        <div class="big" id="big">0<small>/ 0</small></div>
        <div class="summary" id="summary">Nothing in the queue yet.</div>
      </div>
    </section>

    <section class="folder">
      <span class="label">Save to</span>
      <span class="path none" id="folder">No folder chosen</span>
      <button id="choose">Choose folder</button>
    </section>
    <label class="opts"><input type="checkbox" id="skip" checked> Skip files that already exist in the folder</label>

    <div class="banner" id="banner" hidden>
      <span id="banner-text"></span>
      <button id="banner-btn"></button>
    </div>

    <ol id="jobs"></ol>
    <div class="empty" id="empty">Pick videos in the extension popup and click Download. They will show up here.</div>
  </main>
  <script type="module" src="manager.js"></script>
</body>
</html>
