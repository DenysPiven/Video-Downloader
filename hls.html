<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Downloading HLS…</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 640px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; word-break: break-word; }
    .src { color: var(--muted); font-size: 12px; word-break: break-all; margin-bottom: 20px; }
    progress { width: 100%; height: 14px; accent-color: var(--accent); }
    #info { margin-top: 10px; }
    #warn { margin-top: 10px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 id="name">Preparing…</h1>
    <div class="src" id="src"></div>
    <progress id="bar" value="0" max="1"></progress>
    <div id="info">Reading playlist…</div>
    <div id="warn"></div>
  </main>
  <script type="module" src="hls.js"></script>
</body>
</html>
