<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 400px; max-height: 590px; display: flex; flex-direction: column; }

    header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; }
    header h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }

    .settings { margin: 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .setting { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
    .setting + .setting { border-top: 1px solid var(--line); }
    .setting > .label { width: 54px; flex: none; }
    .field { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 2px; }
    .prefix { color: var(--muted); white-space: nowrap; }
    .setting input[type="text"] { flex: 1; min-width: 0; font: inherit; font-weight: 600; color: var(--fg); background: none; border: 0; padding: 0; outline: none; }
    .setting input[type="text"]::placeholder { color: var(--muted); font-weight: 500; }
    .setting input[type="text"]:focus { box-shadow: 0 1px 0 var(--accent); }
    .toggle { cursor: pointer; }

    .picker { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 4px 6px; margin: -4px -6px; background: none; color: var(--fg); font-weight: 600; text-align: left; border-radius: 6px; }
    .picker:hover, .picker[aria-expanded="true"] { background: var(--line); }
    .picker #folder-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker .icon { color: var(--muted); flex: none; }
    .chev { width: 16px; height: 16px; flex: none; color: var(--muted); transition: transform .15s ease; }
    .picker[aria-expanded="true"] .chev { transform: rotate(180deg); }
    #open-folder { padding: 4px; }

    .menu { border-top: 1px solid var(--line); padding: 6px; animation: rise .18s ease both; }
    .menu-item { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; padding: 7px 8px; background: none; color: var(--fg); font-weight: 500; text-align: left; border-radius: 6px; }
    .menu-item:hover { background: var(--line); }
    .menu-item.current { background: var(--line); }
    .menu-item.current .mi-text::after { content: "  ✓"; color: var(--ok); }
    .mi-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .mi-note { font-size: 11px; color: var(--muted); font-weight: 400; }
    .new-folder { display: flex; align-items: center; gap: 2px; margin: 4px 0; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 6px; }
    .new-folder input { flex: 1; min-width: 0; font: inherit; font-weight: 600; color: var(--fg); background: none; border: 0; outline: none; padding: 0; }
    .new-folder input::placeholder { color: var(--muted); font-weight: 400; }
    .new-folder button { padding: 2px 8px; }
    .menu-sep { height: 1px; background: var(--line); margin: 4px 2px; }

    #status { padding: 12px 14px 0; color: var(--muted); font-size: 12px; }
    #status.err { color: var(--err); }

    main { flex: 1; overflow-y: auto; padding: 0 14px 8px; }
    section { padding-top: 14px; }
    .sec-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 4px; }

    .job { padding: 8px 0; border-bottom: 1px solid var(--line); }
    .job:last-child { border-bottom: 0; }
    .job-top { display: flex; gap: 10px; align-items: baseline; }
    .job-name { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job-state { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .job-state.ok { color: var(--ok); } .job-state.err { color: var(--err); }
    .job-sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 2px; margin-top: 6px; background: var(--line); border-radius: 1px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }

    .site { display: flex; align-items: center; gap: 10px; padding-bottom: 6px; }
    .favicon { width: 16px; height: 16px; flex: none; border-radius: 3px; }
    .favicon.letter { display: grid; place-content: center; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 9px; font-weight: 700; }
    .site-text { flex: 1; min-width: 0; }
    .site-host { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .site-title { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .row { display: flex; align-items: center; gap: 10px; padding: 8px 0 8px 26px; border-bottom: 1px solid var(--line); animation: rise .3s ease both; }
    .row input { margin-left: -26px; }
    section .row:last-child { border-bottom: 0; }
    .row-text { flex: 1; min-width: 0; cursor: pointer; }
    .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 28px 24px 20px; color: var(--muted); }
    .empty strong { color: var(--fg); font-size: 14px; }

    footer { padding: 12px 14px 14px; border-top: 1px solid var(--line); background: var(--bg); }
    footer button { width: 100%; padding: 11px; font-size: 14px; }

    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  </style>
</head>
<body>
  <header>
    <img class="mark" src="icons/logo.svg" width="24" height="24" alt="">
    <h1>Video Downloader</h1>
    <button id="refresh" class="ghost" title="Scan again" aria-label="Scan again">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </header>

  <div class="settings">
    <div class="setting">
      <span class="label">Folder</span>
      <button id="folder-btn" class="picker" aria-haspopup="true" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="folder-name">Downloads/Video Downloader</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button id="open-folder" class="ghost" title="Show in Finder" aria-label="Show folder in Finder">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </button>
    </div>
    <div id="folder-menu" class="menu" hidden>
      <div id="folder-list" role="listbox" aria-label="Folders"></div>
      <form id="new-folder" class="new-folder">
        <span class="prefix">Downloads/</span>
        <input type="text" id="new-folder-input" spellcheck="false" placeholder="New folder, e.g. Shows/My Show">
        <button type="submit" class="ghost">Use</button>
      </form>
      <button id="ask-each" class="menu-item" type="button">
        <span class="mi-text">Ask where to save each time…</span>
        <span class="mi-note">Any folder, via the Save dialog</span>
      </button>
    </div>
    <label class="setting toggle"><input type="checkbox" id="skip"> Skip files already downloaded</label>
  </div>

  <div id="status">Looking for videos…</div>
  <main>
    <section id="jobs-box" hidden>
      <div class="sec-head"><span class="label">Downloads</span><button id="clear" class="link">Clear finished</button></div>
      <div id="jobs"></div>
    </section>
    <div id="list"></div>
  </main>

  <footer>
    <button id="download" disabled>Download</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
