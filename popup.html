<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 400px; max-height: 590px; display: flex; flex-direction: column; }

    header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; }
    header h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }

    .folder { display: flex; align-items: center; gap: 8px; margin: 0 14px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .folder .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder .name.none { color: var(--muted); font-weight: 500; }

    #status { padding: 12px 14px 4px; color: var(--muted); font-size: 12px; }
    #status.err { color: var(--err); }

    main { flex: 1; overflow-y: auto; padding: 0 14px 8px; }
    section { padding-top: 14px; }
    .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .post-title { font-weight: 600; margin: 10px 0 2px; font-size: 12px; color: var(--muted); }
    .note { color: var(--muted); padding: 4px 0; }

    .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); animation: rise .3s ease both; }
    .row:last-child { border-bottom: 0; }
    .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .fmt { font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
    .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }

    .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 36px 24px 28px; color: var(--muted); }
    .empty strong { color: var(--fg); font-size: 14px; }

    footer { padding: 12px 14px 14px; border-top: 1px solid var(--line); background: var(--bg); }
    footer button { width: 100%; padding: 11px; font-size: 14px; }

    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  </style>
</head>
<body>
  <header>
    <img class="mark" src="icons/logo.svg" width="24" height="24" alt="">
    <h1>Video Downloader</h1>
    <button id="refresh" class="ghost" title="Scan again" aria-label="Scan again">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </header>

  <div class="folder">
    <span class="label">Save to</span>
    <span class="name none" id="folder">Choose on first download</span>
    <button id="change" class="link">Change</button>
  </div>

  <div id="status">Looking for videos…</div>
  <main id="list"></main>

  <footer>
    <button id="download" disabled>Download</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
